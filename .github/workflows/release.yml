name: Release & Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true

jobs:
  package-ubuntu:
    name: "Ubuntu 24.04 (DEB Package)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-tools-dev nlohmann-json3-dev

      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Generate DEB package
        run: |
          cd build
          cpack -G DEB

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/*.deb

  package-fedora:
    name: "Fedora (RPM Package)"
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          dnf -y update
          dnf -y install cmake gcc-c++ qt6-qtbase-devel qt6-qttools-devel nlohmann-json-devel rpm-build

      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Generate RPM package
        run: |
          cd build
          cpack -G RPM

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: build/*.rpm

  package-arch:
    name: "Arch Linux (Package Source)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-tools-dev nlohmann-json3-dev

      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Generate TGZ package for Arch
        run: |
          cd build
          cpack -G TGZ

      - name: Update PKGBUILD with current version
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s|source=.*|source=(\"https://github.com/vamps-goes-coding/UnifiedConkyControlCenter/releases/download/v\${pkgver}/unified-conky-control-center-\${pkgver}-Linux.tar.gz\")|" PKGBUILD

      - name: Upload Arch package source
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            PKGBUILD
            build/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [package-ubuntu, package-fedora, package-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages

      - name: List artifacts
        run: find release-packages -type f

      - name: Prepare release files
        run: |
          mkdir -p release-files
          cp -r release-packages/* release-files/
          cp install.sh release-files/
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          body: |
            ## Release Notes
            
            This release includes packages for multiple Linux distributions:
            
            ### Installers
            - **DEB** (Debian 12+, Ubuntu 22.04+): `*-Linux-x86_64.deb`
            - **RPM** (Fedora, RHEL, CentOS): `*-Linux-x86_64.rpm`
            - **Arch Linux** (Arch, Manjaro, EndeavourOS): Use the provided `PKGBUILD` file
            - **TGZ** (Generic Linux): `*-Linux-x86_64.tar.gz`
            
            ### Installation Instructions
            
            **Ubuntu/Debian:**
            ```bash
            wget https://github.com/vamps-goes-coding/UnifiedConkyControlCenter/releases/download/${{ github.ref_name }}/unified-conky-control-center-${{ github.ref_name }}-Linux-x86_64.deb
            sudo apt-get install ./unified-conky-control-center-*.deb
            ```
            
            **Fedora/RHEL/CentOS:**
            ```bash
            wget https://github.com/vamps-goes-coding/UnifiedConkyControlCenter/releases/download/${{ github.ref_name }}/unified-conky-control-center-${{ github.ref_name }}-Linux-x86_64.rpm
            sudo dnf install ./unified-conky-control-center-*.rpm
            ```
            
            **Arch Linux:**
            ```bash
            # Download PKGBUILD and source
            wget https://github.com/vamps-goes-coding/UnifiedConkyControlCenter/releases/download/${{ github.ref_name }}/PKGBUILD
            wget https://github.com/vamps-goes-coding/UnifiedConkyControlCenter/releases/download/${{ github.ref_name }}/unified-conky-control-center-${{ github.ref_name }}-Linux-x86_64.tar.gz
            
            # Build and install
            makepkg -si
            ```
            
            **Generic Linux (TGZ):**
            ```bash
            wget https://github.com/vamps-goes-coding/UnifiedConkyControlCenter/releases/download/${{ github.ref_name }}/unified-conky-control-center-${{ github.ref_name }}-Linux-x86_64.tar.gz
            mkdir -p ~/.local
            tar xzf unified-conky-control-center-*.tar.gz -C ~/.local
            ~/.local/usr/local/bin/UnifiedConkyControlCenter
            ```
            
            **Using Smart Installer Script:**
            ```bash
            curl -sSL https://raw.githubusercontent.com/vamps-goes-coding/UnifiedConkyControlCenter/master/install.sh | sudo bash
            ```
            
            Or specify a version:
            ```bash
            curl -sSL https://raw.githubusercontent.com/vamps-goes-coding/UnifiedConkyControlCenter/master/install.sh | sudo bash -s -- --version ${{ github.ref_name }}
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
