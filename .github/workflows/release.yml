name: Release & Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true

jobs:
  # ─── STEP 1: Sync version across all files, and publish the synced ──────────
  # installer as an artifact. Package jobs never read version state from git —
  # they take APP_VERSION_OVERRIDE from this job's outputs, so artifact names
  # are correct regardless of checkout depth or which ref is being built.
  sync-version:
    name: Sync Version Across Files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      num: ${{ steps.ver.outputs.num }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and validate version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION_NUM="${TAG#v}"

          if ! printf '%s' "$VERSION_NUM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION_NUM' is not a valid x.y.z version (tag: $TAG)"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "num=$VERSION_NUM" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG ($VERSION_NUM)"

      - name: Sync version into source files
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NUM="${{ steps.ver.outputs.num }}"

          sed -i "s/^VERSION=\"v.*\"/VERSION=\"$TAG\"/" install.sh
          # NB: do not anchor this on the closing paren — the line is
          # `project(... VERSION x.y.z LANGUAGES CXX)`. Matching up to ')'
          # silently never matched and left CMakeLists.txt at the old version.
          sed -i "s/project(UnifiedConkyControlCenter VERSION [0-9.]*/project(UnifiedConkyControlCenter VERSION $NUM/" CMakeLists.txt
          sed -i "s/^pkgver=.*/pkgver=$NUM/" PKGBUILD
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"$NUM\"/" config/app_config.json

          echo "install.sh       -> $TAG"
          echo "CMakeLists.txt   -> $NUM"
          echo "PKGBUILD         -> $NUM"
          echo "app_config.json  -> $NUM"

      - name: Commit synced versions back to master
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add install.sh CMakeLists.txt PKGBUILD config/app_config.json
          if git diff --cached --quiet; then
            echo "No version changes needed"
          else
            git commit -m "ci: sync version to ${{ steps.ver.outputs.tag }} [skip ci]"
            git push origin master || echo "::warning::Could not push version sync commit"
          fi

      # The tag commit does not contain this sync, so the release must ship the
      # artifact rather than the copy from a tag checkout.
      - name: Upload synced installer
        uses: actions/upload-artifact@v4
        with:
          name: synced-install-sh
          path: install.sh
          if-no-files-found: error

  # ─── STEP 2: Build packages ─────────────────────────────────────────────────
  package-ubuntu:
    name: "Ubuntu 24.04 (DEB Package)"
    needs: sync-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ dpkg-dev qt6-base-dev qt6-tools-dev nlohmann-json3-dev

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION_OVERRIDE=${{ needs.sync-version.outputs.num }}
          cmake --build build -j"$(nproc)"

      - name: Generate DEB package
        run: cpack -G DEB
        working-directory: build

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/*.deb
          if-no-files-found: error

  package-fedora:
    name: "Fedora (RPM Package)"
    needs: sync-version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf -y update
          dnf -y install cmake gcc-c++ qt6-qtbase-devel qt6-qttools-devel nlohmann-json-devel rpm-build

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION_OVERRIDE=${{ needs.sync-version.outputs.num }}
          cmake --build build -j"$(nproc)"

      - name: Generate RPM package
        run: cpack -G RPM
        working-directory: build

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: build/*.rpm
          if-no-files-found: error

  package-arch:
    # NOTE: this TGZ is built on Ubuntu and repackaged for Arch. Qt 6 keeps a
    # stable SONAME within a major version and glibc is backward compatible, so
    # it runs on Arch — but if Arch users report plugin/ABI issues, build this
    # job in an `archlinux` container instead.
    name: "Arch Linux (TGZ + PKGBUILD)"
    needs: sync-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-tools-dev nlohmann-json3-dev

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION_OVERRIDE=${{ needs.sync-version.outputs.num }}
          cmake --build build -j"$(nproc)"

      - name: Generate TGZ package
        run: cpack -G TGZ
        working-directory: build

      - name: Point PKGBUILD at this release and pin its checksum
        run: |
          TAG="${{ needs.sync-version.outputs.tag }}"
          NUM="${{ needs.sync-version.outputs.num }}"
          TGZ="UnifiedConkyControlCenter-${NUM}-Linux-x86_64.tar.gz"

          test -f "build/$TGZ" || { echo "::error::Expected $TGZ, but CPack produced:"; ls build/*.tar.gz; exit 1; }

          HASH="$(sha256sum "build/$TGZ" | awk '{print $1}')"
          sed -i "s/^pkgver=.*/pkgver=$NUM/" PKGBUILD
          sed -i "s|source=.*|source=(\"https://github.com/vamps-goes-coding/UnifiedConkyControlCenter/releases/download/v${NUM}/${TGZ}\")|" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${HASH}')/" PKGBUILD

          echo "--- PKGBUILD ---"
          cat PKGBUILD

      - name: Upload Arch package source
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            PKGBUILD
            build/*.tar.gz
          if-no-files-found: error

  # ─── STEP 3: Create the GitHub Release ──────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [sync-version, package-ubuntu, package-fedora, package-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-packages

      - name: Prepare release files
        run: |
          mkdir -p release-files
          # Packages + PKGBUILD + the version-synced install.sh
          find release-packages -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \
               -o -name 'PKGBUILD' -o -name 'install.sh' \) \
            -exec cp -v {} release-files/ \;

          test -f release-files/install.sh || { echo "::error::synced install.sh missing"; exit 1; }
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          body: |
            ## Unified Conky Control Center ${{ needs.sync-version.outputs.tag }}

            Works on any Linux distro — X11 + Wayland — every desktop environment.

            ### Install options

            | Distro | File |
            |---|---|
            | Debian / Ubuntu 24.04+ | `unified-conky-control-center_${{ needs.sync-version.outputs.num }}_amd64.deb` |
            | Fedora / RPM-based | `unified-conky-control-center-${{ needs.sync-version.outputs.num }}-1.x86_64.rpm` |
            | Arch Linux | `PKGBUILD` + `UnifiedConkyControlCenter-${{ needs.sync-version.outputs.num }}-Linux-x86_64.tar.gz` |
            | Any distro | `install.sh` (smart installer) |

            ### Smart installer

            ```bash
            curl -sSL https://raw.githubusercontent.com/vamps-goes-coding/UnifiedConkyControlCenter/master/install.sh | bash
            ```

            Full install instructions: see the [README](https://github.com/vamps-goes-coding/UnifiedConkyControlCenter#install).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
